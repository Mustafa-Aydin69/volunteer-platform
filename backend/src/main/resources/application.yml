server:
  port: 8080

spring:
  application:
    name: imece
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/imece}
    username: ${DB_USERNAME:root}
    # No default on purpose: the app must fail fast instead of running with a guessed password.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Development only; switch to "validate" before the AWS deployment.
      ddl-auto: update
    # Keeps lazy loading inside the service layer, so controllers cannot trigger hidden queries.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Europe/Istanbul

app:
  jwt:
    # Base64-encoded key of at least 32 bytes (HS256). No default, same reason as the DB password.
    secret: ${JWT_SECRET}
    expiration: 24h
  admin:
    # Only read when no admin account exists yet; can be removed from the environment afterwards.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger UI at /swagger-ui.html. On by default for development and the demo;
# set SWAGGER_ENABLED=false on the server to hide the API map.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
